[package]
name = "fbii"
version = "0.1.0"
edition = "2021"
authors = ["FBII Authors"]
description = "A terminal e-book reader for FB2, FB2-in-ZIP and EPUB with vim-like controls built in Rust"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "process", "io-util", "io-std"] }
futures = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
roxmltree = "0.20"
zip = "2.2"
encoding_rs = "0.8"
unicode-width = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
ratatui-image = { version = "3.0", default-features = false }
# Only enable the image codecs actually useful for e-book cover art; this
# unions with ratatui-image's own mandatory "jpeg" feature request rather
# than pulling in ratatui-image's full default codec set (tiff, bmp, ico,
# dds, tga, hdr, farbfeld, qoi, avif, ...).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
sha1 = "0.10"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dark-light = "1.0"
arboard = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
