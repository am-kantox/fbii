# cargo-audit configuration.
#
# The advisories below are ignored with justification. Re-evaluate this list
# periodically (e.g. after upgrading ratatui/sqlx) since a fixed version may
# become available.

[advisories]
ignore = [
    # rsa 0.9.10, pulled in as an optional dependency of sqlx-mysql (mysql
    # authentication). fbii only enables sqlx's "sqlite" feature; sqlx-mysql
    # and its dependency on rsa are never compiled into this crate. No fixed
    # version of rsa is available upstream for this advisory.
    "RUSTSEC-2023-0071",
    # paste 1.0.15 is unmaintained. It is a transitive proc-macro dependency
    # of ratatui/ratatui-image; fbii does not depend on it directly and has
    # no control over ratatui's choice of macro helper crate.
    "RUSTSEC-2024-0436",
    # lru 0.12.5 is a transitive dependency of ratatui (used for its internal
    # caches). The unsound APIs flagged here (IterMut, panic-safety of pop())
    # are internal implementation details of ratatui, not used directly by
    # fbii.
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
]
